name: Feature request
description: Suggest an improvement to the free edition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What are you trying to do, and what gets in the way?}
    validations: {required: true}
  - type: textarea
    id: idea
    attributes: {label: Proposal, description: What would you like to happen? Alternatives you considered?}
  - type: input
    id: who
    attributes: {label: Who benefits, description: "e.g. clinic front desk, DevOps lead, governance officer"}
